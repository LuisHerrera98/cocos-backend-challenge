services:
  db:
    image: postgres:18-alpine
    container_name: cocos-challenge-db
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - '5433:5432'
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cocos -d cocos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
